<script>
    $(document).ready(function () {
        let flight_list = [];
        let add_flight_list = [];
        let hotel_list = [];
        let add_hotel_list = [];
        let rental_list = [];
        let add_rental_list = [];
        $.ajax({
            "type": "GET",
            "url": "https://" + base_url + "/api/v1/flights?year="+current_year+"&hideFullFlight=false",
            beforeSend: function (xhr) {
                if (sessionStorage.getItem('token')) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + sessionStorage.getItem('token'));
                }
            },
            success: function (response) {
                flight_list = response
                $.each(response, function (index, item) {
                    $("[data-flight_body]").append('<tr><td><select id="startCity"><option value="" disabled selected>선택</option><option value="김포" ' + (item.startCity === "김포" ? "selected" : "") + '>김포</option><option value="부산" ' + (item.startCity === "부산" ? "selected" : "") + '>부산</option><option value="광주" ' + (item.startCity === "광주" ? "selected" : "") + '>광주</option><option value="청주" ' + (item.startCity === "청주" ? "selected" : "") + '>청주</option><option value="대구" ' + (item.startCity === "대구" ? "selected" : "") + '>대구</option></select> - 제주</td><td><select id="airline"><option value="" disabled selected>선택</option><option value="대한항공" ' + (item.airline === "대한항공" ? "selected" : "") + '>대한항공</option><option value="아시아나" ' + (item.airline === "아시아나" ? "selected" : "") + '>아시아나</option></select></td><td><select id="seatClass"><option value="" disabled selected>선택</option><option value="일반" ' + (item.seatClass === "일반" ? "selected" : "") + '>일반</option><option value="비즈니스" ' + (item.seatClass === "비즈니스" ? "selected" : "") + '>비즈니스</option></select></td><td><input id="startFlight" type="text" placeholder="ex) KE1227" value="' + item.startFlight + '" style="width: 100px"></td><td><div class="d-flex flex-column"><input id="startDate" type="date" value="' + item.startDate + '"><input id="startTime" type="time" value="' + item.startTime + '"></div></td><td><input id="endFlight" type="text" placeholder="ex) KE1227" value="' + item.endFlight + '" style="width: 100px"></td><td><div class="d-flex flex-column"><input id="landingDate" type="date" value="' + item.landingDate + '"><input id="landingTime" type="time" value="' + item.landingTime + '"></div></td><td><input id="seniorCost" type="text" value="' + item.seniorCost + '" style="width: 80px">원</td><td><input id="adultCost" type="text" value="' + item.adultCost + '" style="width: 80px">원</td><td><input id="childCost" type="text" value="' + item.childCost + '" style="width: 80px">원</td><td><input id="seatQuantity" type="text" value="' + item.seatQuantity + '" style="width: 50px">석</td><td><input id="flightKeepQuantity" type="text" value="' + item.flightKeepQuantity + '" style="width: 30px">석</td><td class="flight-num">' + item.currentPassengerNumber + '</td><td><button type="button" data-id="' + item.flightId +'" class="delete-btn btn btn-danger btn-m pl-4 pr-4">삭제</button></td></tr>');
                });
                $("[data-flight_body] select, [data-flight_body] input, [data-flight_body] button").prop("disabled", true);
            },
            error: function (xhr) {
                alert(xhr.responseJSON.message)
            }
        });
        $(".mod-btn").click(function () {
            $("[data-flight_body] select, [data-flight_body] input, [data-flight_body] button").prop("disabled", false);
        });
        
        $(".flight-save-btn").click(function () {
            const data = {
                "flights": flight_list,
            };
            $.ajax({
                "type": "PATCH",
                "url": "https://" + base_url + "/api/v1/flights?year=" + current_year,
                "data": JSON.stringify(data),
                "contentType": 'application/json',
                beforeSend: function (xhr) {
                    if (sessionStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + sessionStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    alert("항공편이 수정 되었습니다.")
                    location.reload();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.message)
                }
            });
        });
        
        $(".add-flight-save-btn").click(function () {
            const data = {
                "flights": add_flight_list,
            };
            $.ajax({
                "type": "POST",
                "url": "https://" + base_url + "/api/v1/flights?year=" + current_year,
                "data": JSON.stringify(data),
                "contentType": 'application/json',
                beforeSend: function (xhr) {
                    if (sessionStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + sessionStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    alert("항공편이 추가 되었습니다.")
                    location.reload();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.message)
                }
            });
        });

        //-------------------------- 항공 정보 추가 ------------------------------------
        $(".add-btn").click(function () {
            var startCity = $("#add_startCity").val();
            var airline = $("#add_airline").val();
            var seatClass = $("#add_seatClass").val();
            var startFlight = $("#add_startFlight").val();
            var startDate = $("#add_startDate").val();
            var startTime = $("#add_startTime").val();
            var endFlight = $("#add_endFlight").val();
            var landingDate = $("#add_landingDate").val();
            var landingTime = $("#add_landingTime").val();
            var seniorCost = $("#add_seniorCost").val();
            var adultCost = $("#add_adultCost").val();
            var childCost = $("#add_childCost").val();
            var seatQuantity = $("#add_seatQuantity").val();
            var flightKeepQuantity = $("#add_flightKeepQuantity").val();
            if (
                startCity === null ||
                airline === null ||
                seatClass === null ||
                startFlight === "" ||
                startDate === "" ||
                startTime === "" ||
                endFlight === "" ||
                landingDate === "" ||
                landingTime === "" ||
                seniorCost === "" ||
                adultCost === "" ||
                childCost === "" ||
                seatQuantity === "" ||
                flightKeepQuantity === ""
            ) {
                alert("모든 필드를 입력해주세요.");
            }else{
                add_flight_list.push({

                if (confirm("이 정보를 삭제하시겠습니까? 삭제된 정보는 복구가 불가능 합니다.")) {
                    const data = {
                        "ids": [id]
                    }
                    $.ajax({
                        "type": "DELETE",
                        "url": "https://" + base_url + "/api/v1/renter-cars",
                        "data": JSON.stringify(data),
                        "contentType": 'application/json',
                        beforeSend: function (xhr) {
                            if (localStorage.getItem('token')) {
                                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                            }
                        },
                        success: function (response) {
                            alert("삭제 되었습니다.");
                            location.reload();

                        },
                        error: function (xhr) {
                            alert(xhr.responseJSON.message)
                        }
                    });
                }
            }
        });

        $(document).on("click", ".rental-add-delete-btn", function () {
            var row = $(this).closest("tr");
            var index = row.index("[data-hotel_foot] tr");
            $(this).closest("tr").remove();
            add_rental_list.splice(index - 1, 1);
        });

        $(".rental-add-btn").click(function () {
            var type = $("#add_type").val();
            var name = $("#add_name").val();
            var cost = $("#add_cost").val();
            var quantity = $("#add_quantity").val();
            var renterCarKeepQuantity = $("#add_renterCarKeepQuantity").val();
            if (
                type === null ||
                name === "" ||
                cost === "" ||
                quantity === "" ||
                renterCarKeepQuantity === ""
            ) { alert("모든 필드를 입력해주세요."); }
            else {
                add_rental_list.push({
                    "type": type,
                    "name": name,
                    "cost": cost,
                    "quantity": quantity,
                    "currentOrderNumbers": 0,
                    "renterCarKeepQuantity": renterCarKeepQuantity
                });
                console.log(type)
                $("[data-rental_foot]").append('<tr><td><select id="type"><option value="" disabled selected>선택</option><option value="LUXURY" ' + (type === "LUXURY" ? "selected" : "") + '>고급</option><option value="MID_SIZE" ' + (type === "MID_SIZE" ? "selected" : "") + '>중형</option><option value="SUV" ' + (type === "SUV" ? "selected" : "") + '>SUV</option><option value="CARNIVAL" ' + (type === "CARNIVAL" ? "selected" : "") + '>카니발급</option><option value="ELECTRIC" ' + (type === "전기차" ? "selected" : "") + '>전기차</option></select></td><td><input type="text" id="name" value="' + name + '"></td></td><td><input type="text" id="cost" value="' + cost + '"></td><td><input type="text" id="quantity" value="' + quantity + '"></td><td><input type="text" id="renterCarKeepQuantity" value="' + renterCarKeepQuantity + '"></td><td colspan="2"><button type="button" class="rental-add-delete-btn btn btn-danger btn-m pl-4 pr-4">삭제</button></td></tr>');

                $('.reset').val("");
            }
        });

        function handleInputChangeRental(element) {
            var newValue = element.value;
            var trIndex = $(element).closest('tr').index();
            var rentalItem = rental_list[trIndex];
            var attributeName = element.id;
            rentalItem[attributeName] = newValue;
            rental_list[trIndex] = rentalItem;
        }

        function addHandleInputChangeRental(element) {
            var newValue = element.value;
            var trIndex = $(element).closest('tr').index();
            var rentalItem = add_rental_list[trIndex - 1];
            var attributeName = element.id;
            add_rental_list[attributeName] = newValue;
            add_hotel_list[trIndex - 1] = rentalItem;
        }

        $(document).on('change', '[data-rental_body] #type, [data-rental_body] #name, [data-rental_body] #cost, [data-rental_body] #quantity', function () {
            handleInputChangeRental(this);
        });

        $(document).on('change', '[data-rental_foot] #type, [data-rental_foot] #name, [data-rental_foot] #cost, [data-rental_foot] #quantity', function () {
            addHandleInputChangeRental(this);
        });

        $(".rental-save-btn").click(function () {
            const data = {
                "renterCars": rental_list,
            };
            console.log(data)
            $.ajax({
                "type": "PATCH",
                "url": "https://" + base_url + "/api/v1/renter-cars?year=" + current_year,
                "data": JSON.stringify(data),
                "contentType": 'application/json',
                beforeSend: function (xhr) {
                    if (sessionStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + sessionStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    alert("렌터카 정보가 수정 되었습니다.")
                    location.reload();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.message)
                }
            });
        });

        $(".add-rental-save-btn").click(function () {
            const data = {
                "renterCars": add_rental_list,
            };
            console.log(data)
            $.ajax({
                "type": "POST",
                "url": "https://" + base_url + "/api/v1/renter-cars?year=" + current_year,
                "data": JSON.stringify(data),
                "contentType": 'application/json',
                beforeSend: function (xhr) {
                    if (sessionStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + sessionStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    alert("렌터카 정보가 추가 되었습니다.")
                    location.reload();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.message)
                }
            });
        });
    })
</script>
</body>

</html>
