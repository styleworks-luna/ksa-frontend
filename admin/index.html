    <script>
        $(document).ready(function () {
            let url = window.location.href;
            let base_url = url.replace(/^(https?:\/\/)?(www\.)?/i, "").split('/')[0];
            if (base_url === "koita2023.onoffmix.xyz") {
                base_url = "api-" + base_url
            }
            // let base_url = "api-ksa.onoffmix.xyz";
            $.ajax({
                type: "GET",
                url: "https://" + base_url + "/api/v1/attends/counting",
                beforeSend: function (xhr) {
                    if (localStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    const friend_group = response.ksaCompanyTypeCount.ksaCompanyTypeCount
                    const template = `
                            <div class="container-fluid p-0">
                            <div class="row">
                                <div class="col-xl-4 col-lg-5">
                                    <div class="card shadow mb-4 pb-5">
                                        <div class="card-body">
                                            <p class="text-primary" style="font-weight: bold;">참가자 등록 현황</p>
                                            <div class="chart-pie pt-4 pb-5">
                                                <table class="table text-center font-weight-bold">
                                                    <thead>
                                                        <tr>
                                                            <th class="table-dark">구분</th>
                                                            <th>신청중</th>
                                                            <th>신청완료</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <th class="table-dark" style="width: 150px">참가자</th>
                                                            <td>${response.attenderTypeAndAttendStatusCount.applyingAttender.mainAttender + "명"}</td>
                                                            <td>${response.attenderTypeAndAttendStatusCount.doneAttender.mainAttender + "명"}</td>
                                                        </tr>
                                                        <tr>
                                                            <th class="table-dark" style="width: 150px">동반가족</th>
                                                            <td>${response.attenderTypeAndAttendStatusCount.applyingAttender.familyAttender + "명"}</td>
                                                            <td>${response.attenderTypeAndAttendStatusCount.doneAttender.familyAttender + "명"}</td>
                                                        </tr>
                                                        <tr>
                                                            <th class="table-dark" style="width: 150px">총계</th>
                                                            <td>${response.applyingAttenderCount + "명"}</td>
                                                            <td>${response.doneAttenderCount + "명"}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                           
                        </div>`;
                    $(".table-wrap").html(template);
                },
                error: function (xhr, status, error) {
                    if (xhr.status === 401) {
                        alert("로그인이 필요한 페이지입니다.")
                        window.location.href = 'login.html';
                    } else {
                        alert("error")
                    }
                }
            });
        });
    </script>
