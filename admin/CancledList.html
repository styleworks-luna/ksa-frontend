    <script>
        let url = window.location.href;
        let base_url = url.replace(/^(https?:\/\/)?(www\.)?/i, "").split('/')[0];
        if (base_url === "ksa.onoffmix.xyz") {
            base_url = "api-" + base_url
        }
        // let base_url = "api-ksa.onoffmix.xyz";
        const data = [
            {
                render: function (data, type, row, meta) {
                    var data = $('#dataTable').DataTable().ajax.json();
                    var maxIndex = data.length;
                    return maxIndex - meta.row;
                },
                "searchable": false
            },
            {
                render: function (data, type, row) {
                    return '<a class="font-weight-bold board-title" href="ParticipantDetail/' + row.attendId + '.html">' + row.company.companyName + '</a>';
                },
            },
            {
                render: function (data, type, row) {
                    return row.mainAttender.koreaName;
                },
            },
            {
                render: function (data, type, row) {
                    if( row.ksaCompanyType === "MEMBER" ){
                        return '회원사';
                    } else if( row.ksaCompanyType === "NOT_MEMBER" ){
                        return '비회원사';
                    } else if (row.ksaCompanyType === "HIGHEST_LEVEL") {
                        return '최고위과정 및 서비스포럼사';
                    }else{
                        return '해당없음';
                    }
                },
                "searchable": false
            },
            {
                render: function (data, type, row) {
                    return row.familyAttenders.length + 1
                },
                "searchable": false
            },
            {
                render: function (data, type, row) {
                    return row.updatedAt
                },
                "searchable": false
            },
            {
                render: function (data, type, row) {
                    return '<button type="button" value="' + row.attendId + '" class="back-btn btn btn-success btn-sm p-1 pl-3 pr-3 font-weight-bold">복구</button>'
                },
                "searchable": false
            },
            {
                render: function (data, type, row) {
                    return '<button type="button" value="' + row.attendId + '" class="delete-btn btn btn-danger btn-sm p-1 pl-3 pr-3 font-weight-bold">삭제</button>'
                },
                "searchable": false
            },
            
        ];
        $('#dataTable').dataTable({
            "ajax": {
                "url": "https://" + base_url + "/api/v1/attends/canceled",
                beforeSend: function (xhr) {
                    if (localStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                    }
                },
                "dataSrc": function (json) {
                    return json;
                },
                "error": function (xhr, status, error) {
                    if (xhr.status === 401) {
                        alert("로그인이 필요한 페이지입니다.")
                        window.location.href = 'login.html';
                    } else {
                        alert("error")
                    }
                }
            },
            "language": {
                "emptyTable": "결과가 없습니다"
            },
            aLengthMenu: [20, 30, 50, 100],
            columns: data
        });

        $('#dataTable').on('click', '.delete-btn', function () {
            const id_num = $(this).val();
            if (confirm("목록에서 삭제 하시겠습니까? \n이 동작은 되돌릴 수 없습니다.")) {
                $.ajax({
                    type: "DELETE",
                    url: "https://" + base_url + "/api/v1/attends/" + id_num,
                    beforeSend: function (xhr) {
                        if (localStorage.getItem('token')) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                        }
                    },
                    "contentType": 'application/json',
                    success: function (response) {
                        alert("삭제 되었습니다.")
                        location.reload()
                    },
                    error: function (xhr, status, error) {
                        alert(error);
                    }
                });
            }
        });
        
        $('#dataTable').on('click', '.back-btn', function () {
            const id_num = $(this).val();
            if (confirm("신청을 복구 하시겠습니까?")) {
                $.ajax({
                    type: "PATCH",
                    url: "https://" + base_url + "/api/v1/attends/" + id_num + "/comeback",
                    beforeSend: function (xhr) {
                        if (localStorage.getItem('token')) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                        }
                    },
                    "contentType": 'application/json',
                    success: function (response) {
                        alert("복구 되었습니다.")
                        location.reload()
                    },
                    error: function (xhr, status, error) {
                        alert(error);
                    }
                });
            }
        });
        $('.excel-btn').on('click', function () {
            window.open('data:application/vnd.ms-excel,' + $('[data-excel_table]').html());
            e.preventDefault();
        });

        $('#dataTable').on('click', '.board-title', function (e) {
            e.preventDefault();
            var id = $(this).attr('href');
            const num = $.trim(id.replace(/[^0-9]/g, ''));
            window.location.href = '/admin/ParticipantDetail.html?id=' + num;
        });
    </script>
