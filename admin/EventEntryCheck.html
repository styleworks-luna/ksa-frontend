                    <!-- 상단 설정 영역 -->

                    <!-- 검색 영역 -->

                    <!-- 입장자 목록 테이블 -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">오늘의 입장자 명단</h6>
                        </div>
                        <div class="card-header py-3 d-flex justify-content-end">

                                    </thead>

                                        <!-- 입장 데이터가 여기에 추가됨 -->

                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

    </div>

    <!-- 알림 모달 (에러 및 안내용) -->

    </div>

    <!-- 중복 검색 결과 선택 모달 -->
    <div class="modal fade" id="duplicateModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title font-weight-bold">검색 결과가 여러 명입니다. 대상자를 선택하세요.</h5>
                    <button class="close text-white" type="button" data-dismiss="modal" aria-label="Close">

                <div class="modal-body">
                    <div class="table-responsive">

                                <tr>
                                    <th>소속</th>

                                    <th>휴대전화</th>

                                    <th>선택</th>

    <!-- 입장 성공 확인 모달 -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-left-success shadow">
                <div class="modal-body text-center py-5">
                    <i class="fas fa-check-circle text-success fa-4x mb-3"></i>
                    <h3 class="font-weight-bold text-success mb-2">입장 확인</h3>
                    <h4 class="text-gray-900 mb-1"><span id="successName"></span> 님</h4>
                    <p class="text-muted mb-0" id="successCompany"></p>
                </div>
            </div>
        </div>

    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel"></h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body text-center">로그아웃 하시겠습니까?</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                    <button class="logout-btn btn btn-primary">확인</button>

            </div>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/sb-admin-2.js"></script>
    <script src="/js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="/admin/js/common.js"></script>

    <script>
        let allParticipants = []; // 해당 연도 입장 가능 대상자 풀
        let enteredIds = new Set(); // 중복 체크용 (attendId_attenderId 조합)
        let eventsData = []; // 해당 연도의 모든 행사 데이터
        let selectedEventId = null;
        let selectedEventMaxCapacity = 0;
        let currentEnteredCount = 0;
        let refreshInterval = null;
        let inputResetTimer = null;

        function loadYearOptions() {
            let yearOptions = '';
            const currentYear = new Date().getFullYear();
            for (let i = currentYear + 1; i >= 2024; i--) { 
                yearOptions += `<option value="${i}" ${i === currentYear ? 'selected' : ''}>${i}년</option>`;
            }
        }

        // 주기적 자동 갱신
        function startAutoRefresh() {
            stopAutoRefresh();
            refreshInterval = setInterval(function() {
                if (selectedEventId) loadExistingEntries(selectedEventId);
            }, 30000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        }

        //화면출력 모달
        function showAlertModal(message) {
            $('#alertMessage').text(message);
            $('#alertModal').modal('show');
            setTimeout(function() {
                $('#alertModal').modal('hide');
            }, 1500);
        }

        // 행사 목록 로드
        function loadEvents(year) {
            $.ajax({
                url: base_url + '/api/v1/events?year=' + year,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                success: function(res) {
                    eventsData = res; // 모든 행사 데이터를 저장
                    let options = '<option value="">행사를 선택해주세요</option>';
                    res.forEach(ev => {
                        options += `<option value="${ev.id}">${ev.title}</option>`;
                    });
                    $('#eventSelect').html(options);
                },
                error: function(xhr) {
                    console.error("Error loading events:", xhr);
                    showAlertModal("행사 목록을 불러오는 데 실패했습니다.");
                }
            });
        }

        // 입장 가능자 풀 로드 (년도 기준)
        function loadParticipantsPool(year) {
                $.ajax({
                    url: base_url + "/api/v1/attends/search?year=" + year,
                    method: 'GET',
                    data: {                      
                        ksaCompanyType: "",
                        // depositStatus: 'FULL_PAY', // 결제 완료된 인원만
                        //attendStatus: 'DONE'       // 신청 완료 상태
                        attendStatus: "",
                        depositStatus: "",
                        taxBillPublishStatus: "",

                    },
                    beforeSend: function (xhr) {
                        if (localStorage.getItem('token')) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                        }
                    },
                    success: function (response) {
                    allParticipants = response;
                    console.log("대상자 풀 로드 완료:", allParticipants.length); // 대상자 풀 로드 확인용 로그
                },
                error: function(xhr) {
                    console.error("Error loading participants pool:", xhr);
                    showAlertModal("참가자 명단을 불러오는 데 실패했습니다.");
                    }
                });
            
        }

        // 입장 완료자 목록 로드 및 UI 갱신 
        function loadExistingEntries(eventId) {
            if (!eventId) return;

            $.ajax({
                url: base_url + `/api/v1/events/${eventId}/entries`,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                success: function(res) {
                    $('#entryBody').empty();
                    enteredIds.clear();
                    currentEnteredCount = 0;

                    // 최신순 정렬 (입장시간 기준 내림차순)
                    if (res && res.length > 0) {
                        res.sort((a, b) => new Date(b.entryTime) - new Date(a.entryTime));
        
                        res.forEach(entry => {
                            let timeStr = "-";
                            if (Array.isArray(entry.entryTime) && entry.entryTime.length >= 5) {
                                const dt = new Date(
                                    entry.entryTime[0], // 년
                                    entry.entryTime[1] - 1, // 월 (0-indexed)
                                    entry.entryTime[2], // 일
                                    entry.entryTime[3], // 시
                                    entry.entryTime[4], // 분
                                    entry.entryTime[5] || 0 // 초 (선택사항, 없으면 0)
                                );
                                timeStr = String(dt.getHours()).padStart(2, '0') + ":" + String(dt.getMinutes()).padStart(2, '0');
                            }
                            
                            const row = `
                                <tr>
                                    <td class="text-primary font-weight-bold">${timeStr}</td>
                                    <td>${entry.companyName}</td>
                                    <td>${entry.name}</td>
                                    <td>${entry.grade || '-'}</td>
                                    <td><span class="badge ${entry.entryType === 'MAIN' ? 'badge-info' : 'badge-secondary'}">${entry.entryType === 'MAIN' ? '대표자' : '동반가족'}</span></td>
                                    <td class="text-success"><i class="fas fa-check-circle mr-1"></i>정상입장</td>
                                </tr>
                            `;
                            $('#entryBody').append(row);
                            enteredIds.add(`${entry.attendId}_${entry.attenderId}`);
                            currentEnteredCount++;
                        });
                    }
                }
            });
        }

        function checkSearchActivation() {
            const isReady = $('#forumYear').val() && selectedEventId;
            $('#qrSearchInput').prop('disabled', !isReady);
            if(isReady) $('#qrSearchInput').focus();
        }

        // 검색 및 입장 처리 (QR 스캔 또는 수기 입력)
        function handleSearch(input) {
            const cleanInput = input.trim();
            if (!cleanInput) return;
            
            // 즉시 입력창 초기화 및 포커스 (다음 스캔 준비)
            $('#qrSearchInput').val('').focus();

            if (!selectedEventId) {
                showAlertModal("행사를 먼저 선택해주세요.");
                return;
            }

            if (cleanInput.length === 14 && /^\d+$/.test(cleanInput)) { // QR 코드 형식 (년도4 + attendId5 + attenderId5)
                const year = cleanInput.substring(0, 4);
                const attendId = parseInt(cleanInput.substring(4, 9), 10);
                const attenderId = parseInt(cleanInput.substring(9, 14), 10);
                
                const target = findParticipant(attendId, attenderId);
                if (target) {
                    processEntry(target);
                } else {
                    showAlertModal("참가자 정보를 찾을 수 없습니다.");
                }
            } else { // 수기 검색 (이름 또는 전화번호)
                const results = searchParticipantsManually(cleanInput);
                if (results.length === 0) {
                    showAlertModal("일치하는 참가자가 없습니다.");
                } else if (results.length > 1) {
                    showDuplicateModal(results);
                } else {
                    processEntry(results[0]);
                }
            }
        }

        // 대상자 풀에서 QR 정보로 특정 참가자 찾기
        function findParticipant(attendId, attenderId) {
            const attend = allParticipants.find(a => a.attendId == attendId);
            if (!attend) return null;

            // 대표자 확인
            if (attend.mainAttender.mainAttenderId == attenderId) {
                return { attend, person: attend.mainAttender, type: '대표자' };
            }
            // 동반가족 확인
            const family = attend.familyAttenders.find(f => f.familyAttenderId == attenderId);
            if (family) {
                return { attend, person: family, type: '동반가족' };
            }
            return null;
        }

        // 수기 검색 (이름 또는 전화번호)
        function searchParticipantsManually(query) {
            let matches = [];
            const lowerCaseQuery = query.toLowerCase();
            allParticipants.forEach(a => {
                // 대표자 검색
                if (a.mainAttender.koreaName.toLowerCase().includes(lowerCaseQuery) || a.mainAttender.mobilePhone.replace(/-/g, '').includes(query.replace(/-/g, ''))) {
                    matches.push({ attend: a, person: a.mainAttender, type: '대표자' });
                }
                // 동반가족 검색
                a.familyAttenders.forEach(f => {
                    if (f.name.toLowerCase().includes(lowerCaseQuery) || f.mobilePhone.replace(/-/g, '').includes(query.replace(/-/g, ''))) {
                        matches.push({ attend: a, person: f, type: '동반가족' });
                    }
                });
            });
            return matches;
        }

        // 중복 검색 결과 모달 표시
        function showDuplicateModal(results) {
            let html = '';
            results.forEach((item, index) => {
                const phone = item.person.mobilePhone || '-';
                const name = item.person.koreaName || item.person.name;
                html += `
                    <tr>
                        <td class="align-middle">${item.attend.company.companyName}</td>
                        <td class="align-middle">${name}</td>
                        <td class="align-middle">${phone}</td>
                        <td class="align-middle"><span class="badge ${item.type === '대표자' ? 'badge-info' : 'badge-secondary'}">${item.type}</span></td>
                        <td>
                            <button class="btn btn-primary btn-sm px-3" onclick="selectFromDuplicate(${index})">선택</button>
                        </td>
                    </tr>
                `;
            });
            $('#duplicateListBody').html(html);
            window.tempResults = results; // 선택을 위해 임시 저장
            $('#qrSearchInput').blur(); // 모달 뜰 때 포커스 해제
            $('#duplicateModal').modal('show');
        }

        // 모든 모달이 닫힐 때 QR 입력창에 포커스 복구
        $('#duplicateModal, #alertModal, #successModal').on('hidden.bs.modal', function () {
            $('#qrSearchInput').focus();
        });

        // 중복 검색 결과 모달에서 참가자 선택 시 처리
        function selectFromDuplicate(index) {
            const target = window.tempResults[index];
            processEntry(target);
        }

        // 입장 처리 및 UI 업데이트
        function processEntry(target) {
            const attenderId = target.person.mainAttenderId || target.person.familyAttenderId;
            const uniqueKey = `${target.attend.attendId}_${attenderId}`;

            const displayName = target.person.koreaName || target.person.name;
            
            // 서버 입장 처리 API 호출
            $.ajax({
                url: base_url + `/api/v1/events/${selectedEventId}/entries`,
                method: 'POST',
                contentType: 'application/json',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                data: JSON.stringify({
                    attendId: target.attend.attendId,
                    attenderId: attenderId,
                    entryType: target.type === '대표자' ? 'MAIN' : 'FAMILY'
                }),
                success: function() {
                    // 입장 완료 성공 모달 표시
                    $('#successName').text(displayName);
                    $('#successCompany').text(target.attend.company.companyName); // 회사명 표시
                    $('#successModal').modal('show');
                    
                    setTimeout(function() {
                        $('#successModal').modal('hide');
                    }, 1000);

                    // 성공 후 즉시 전체 명단 갱신 (Renew)
                    loadExistingEntries(selectedEventId);
                    console.log("Entry Success:", target);
                },
                error: function(xhr) {
                    const msg = xhr.responseJSON ? xhr.responseJSON.message : "입장 처리 중 오류가 발생했습니다.";
                    showAlertModal(msg);
                    loadExistingEntries(selectedEventId);
                }
            });
        }

        $(document).ready(function () {
            loadYearOptions(); 

            $('#forumYear').change(function() {
                const year = $(this).val();
                loadEvents(year);
                loadParticipantsPool(year);
                selectedEventId = null;
                selectedEventMaxCapacity = 0;
                currentEnteredCount = 0;
                $('#entryBody').empty();
                enteredIds.clear();
                checkSearchActivation();
            }).trigger('change');

            $('#eventSelect').change(function() {
                selectedEventId = $(this).val();
                if (selectedEventId) {
                    const event = eventsData.find(e => e.id == selectedEventId);
                    if (event) {
                        selectedEventMaxCapacity = event.maxCapacity;
                        currentEnteredCount = 0; 
                        $('#entryBody').empty(); 
                        enteredIds.clear(); 
                        console.log(`Selected Event: ${event.title}, Max Capacity: ${selectedEventMaxCapacity}`);
                        loadExistingEntries(selectedEventId);
                        startAutoRefresh(); // 주기적 갱신 시작
                    }
                } else {
                    selectedEventMaxCapacity = 0;
                    currentEnteredCount = 0;
                    stopAutoRefresh();
                    $('#entryBody').empty();
                    enteredIds.clear();
                }
                checkSearchActivation();
            });

            $('#btnManualSearch').click(function() {
                handleSearch($('#qrSearchInput').val());
            });

            $('#qrSearchInput').on('keydown', function(e) {
                if (e.key === 'Enter') {
                    handleSearch($(this).val());
                }
            });

            $('#qrSearchInput').on('input', function() {
                const $input = $(this);
                const val = $input.val().trim();

                // 14자리 숫자 규격 확인 (QR 규격: 년도4 + attendId5 + attenderId5)
                if (val.length === 14 && /^\d+$/.test(val)) {
                    handleSearch(val);
                }

                clearTimeout(inputResetTimer);
                if (val !== '') {
                    inputResetTimer = setTimeout(function() {
                        $input.val('');
                    }, 5000);
                }
            });

            // 입장자 명단 엑셀 다운로드
            $('#downloadEntryExcel').click(function() {
                if (!selectedEventId) {
                    showAlertModal("행사를 먼저 선택해주세요.");
                    return;
                }
                $.ajax({
                    url: base_url + `/api/v1/excel/events/${selectedEventId}/entries`,
                    method: 'GET',
                    "Content-Type": "application/json",
                    xhrFields: {
                        responseType: 'blob' 
                    },
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    success: function (response) {
                        const aTag = document.createElement('a');
                        const url = window.URL.createObjectURL(response);
                        aTag.href = url;
                        const selectedEvent = eventsData.find(e => e.id == selectedEventId);
                        const eventYear = $("#forumYear").val();
                        const eventTitle = selectedEvent ? selectedEvent.title : "\uC785\uC7A5\uC790";
                        const safeEventTitle = eventTitle.replace(/[\\/:*?"<>|]/g, "_");
                        aTag.download = `${eventYear}_${safeEventTitle}_\uC785\uC7A5\uC790\uBA85\uB2E8.xlsx`;
                        aTag.click();
                        window.URL.revokeObjectURL(url);
                    },
                    error: function (xhr) {
                        alert(xhr.responseJSON.message);
                    }
                });
            });
        });
    </script>
</body>

</html>
