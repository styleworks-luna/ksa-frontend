<!DOCTYPE html>
<html lang="kor">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>관리자 페이지 - KSA</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="css/sb-admin-2.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
</head>
<body class="bg-gradient-light">
    <div class="container">
        <div class="">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">로그인</h1>
                                    </div>
                                    <form class="user">
                                        <div class="form-group">
                                            <input type="text" class="form-control form-control-user"
                                                id="id" aria-describedby="emailHelp"
                                                placeholder="아이디를 입력하세요.">
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user"
                                                id="pw" placeholder="비밀번호를 입력하세요.">
                                        </div>
                                        <button type="button" class="login btn btn-primary btn-user btn-block">
                                            로그인
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let url = window.location.href;
        let base_url = url.replace(/^(https?:\/\/)?(www\.)?/i, "").split('/')[0];
        if (base_url === "ksa.onoffmix.xyz") {
            base_url = "api-" + base_url
        }
        // let base_url = "api-ksa.onoffmix.xyz";
        $(".login").on("click", (event) => {
            const id_val = $("#id").val();
            const pw_val = $("#pw").val();
            const data = {
                "id": id_val,
                "password": pw_val
            }
            if(id_val === "" || pw_val === ""){
                alert("아이디와 비밀번호를 모두 입력해주세요.")
            }else{
                $.ajax({
                    "url": "https://"+ base_url +"/api/v1/admin/login",
                    "method": "POST",
                    data: JSON.stringify(data),
                    "Content-Type": "application/json",
                    success: function (response) {
                        localStorage.setItem('token', response.accessToken.token)
                        sessionStorage.setItem('token', response.accessToken.token)
                        window.location = "index.html";
                    },
                    error: function (xhr, status, error) {
                        alert("존재하지 않는 회원입니다.");
                    }
                });
            }
        });
    </script>
</body>
</html>
