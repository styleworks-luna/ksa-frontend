    <script>
        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        const id_num = getParameterByName('id');
        const year = $("select").val();
        const title = $("input[type='text']").val();
        const file = $("#inputGroupFile02").val();

       var formData = new FormData();
        $('input[type="file"]').change(function (e) {
            var file = e.target.files[0];
            var file_size = e.target.files[0].size;
            var file_name = e.target.files[0].name;
            var max_size = 5 * 1024 * 1024;
            if (file_size > max_size) {
                var reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    var img = new Image();
                    img.src = this.result;
                    img.onload = function () {
                        var canvas = document.createElement('canvas');
                        var ctx = canvas.getContext('2d');
                        var max_width = 1280;
                        var max_height = 1280;
                        var width = img.width;
                        var height = img.height;
                        if (width > max_width || height > max_height) {
                            if (width > height) {
                                height *= max_width / width;
                                width = max_width;
                            } else {
                                width *= max_height / height;
                                height = max_height;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(function (blob) {
                            formData.append('image', blob, file_name);
                            $('.custom-file-label').html(file_name);
                        }, 'image/jpeg', 0.8);
                    };
                };
            } else {
                formData.append('image', file);
                $('.custom-file-label').html(file_name);
            }
        });
        $('.reset-btn').on("click", (event) => {
            $("#inputGroupFile02").val("");
            $('.custom-file-label').html("이미지를 첨부해주세요.")
        });

        if (id_num !== null) {
            $.ajax({
                url: "https://"+ base_url +"/api/v1/galleries/" + id_num,
                type: 'GET',
                beforeSend: function (xhr) {
                    if (localStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    $("select").val(response.year);
                    $("input[type='text']").val(response.title);
                    $(".custom-file-label").text(response.image.originalFileName);
                },
                error: function (xhr) {
                    alert('잘못된 요청입니다.');
                }
            });
            
            $("button[type='submit']").on("click", (event) => {
                const year = $("select").val();
                const title = $("input[type='text']").val();
                const file = $("#inputGroupFile02").val();
                if(year === "") {
                    alert('년도를 설정해주세요.')
                } else if (title === "") {
                    alert("제목을 등록해주세요.")
                } else {
                    const data = {
                        "year": $("select").val(),
                        "title": $("input[type='text']").val(),
                    };
                    formData.append('request', new Blob([JSON.stringify(data)], { type: "application/json" }));
                    $.ajax({
                        url: "https://"+ base_url +"/api/v1/galleries/" + id_num,
                        type: 'PATCH',
                        data: formData,
                        beforeSend: function (xhr) {
                            if (localStorage.getItem('token')) {
                                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                            }
                        },
                        "processData": false,
                        "contentType": false,
                        "cache": false,
                        "enctype": "multipart/form-data",
                        success: function (response) {
                            alert('수정 되었습니다.');
                            window.location.href = "GalleryList.html";
                        },
                        error: function (xhr) {
                            if (xhr.status === 401) {
                                alert("로그인이 필요한 페이지입니다.")
                                window.location.href = 'login.html';
                            } else {
                                alert('이미지 수정에 실패하였습니다.');
                            }
                        }
                    });
                 }
                
            })

            $(".cancle-btn").on("click", (event) => {
                if (confirm("수정을 취소 하시겠습니까?")) {
                    window.history.back();
                }
            });
        }else{
            $("button[type='submit']").on("click", (event) => {
                const year = $("select").val();
                const title = $("input[type='text']").val();
                const file = $("#inputGroupFile02").val();
                if (year === "" || title === "" || file === "") {
                    alert("년도, 제목과 파일을 모두 등록해주세요.")
                }else{
                    const image = $("#inputGroupFile02").get(0).files[0];
                    const data = {
                        "year": $('select').val(),
                        "title": $("input[type='text']").val(),
                    };
                    formData.append('request', new Blob([JSON.stringify(data)], { type: "application/json" }));
                    $.ajax({
                        url: "https://"+ base_url +"/api/v1/galleries",
                        type: 'POST',
                        data: formData,
                        beforeSend: function (xhr) {
                            if (localStorage.getItem('token')) {
                                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                            }
                        },
                        "processData": false,
                        "contentType": false,
                        "cache": false,
                        "enctype": "multipart/form-data",
                        success: function (response) {
                            alert('갤러리에 등록 되었습니다.');
                            window.location.href = "GalleryList.html";
                        },
                        error: function (xhr) {
                            if (xhr.status === 401) {
                                alert("로그인이 필요한 페이지입니다.")
                                window.location.href = 'login.html';
                            } else {
                                alert('갤러리 등록에 실패하였습니다.');
                            }
                        }
                    });
                }
            });
            $(".cancle-btn").on("click", (event) => {
                const year = $("select").val();
                const title = $("input[type='text']").val();
                const file = $("#inputGroupFile02").val();
                if (year === "" && title === "" && file === "") {
                    window.history.back();
                } else {
                    if (confirm("등록을 취소 하시겠습니까?")) {
                        window.history.back();
                    }
                }
            });
        }
