    <script>
        let url = window.location.href;
        let base_url = url.replace(/^(https?:\/\/)?(www\.)?/i, "").split('/')[0];
        if (base_url === "ksa.onoffmix.xyz") {
            base_url = "api-" + base_url
        }
        // let base_url = "api-ksa.onoffmix.xyz";
        $('#dataTable').dataTable({
            "ajax": {
                "url": "https://"+ base_url +"/api/v1/galleries/all",
                beforeSend: function (xhr) {
                    if (localStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                    }
                },
                "dataSrc": function (json) {
                    return json;
                },
            },
            "language": {
                "emptyTable": "등록된 이미지가 없습니다."
            },
            order: [[0, "desc"]],
            aLengthMenu: [20, 30, 50, 100],
            columns: [
                {
                    render: function (data, type, row, meta) {
                        var data = $('#dataTable').DataTable().ajax.json();
                        var maxIndex = data.length;
                        return maxIndex - meta.row;
                    },
                    "searchable": false
                },
                {
                    render: function (data, type, row) {
                        return '<p>' + row.title + '</p>';
                    },
                },
                {
                    render: function (data, type, row) {
                        return '<td><button type="button" class="btn btn-primary btn-sm p-1 pl-3 pr-3 mr-1 font-weight-bold" value="' + row.galleryId +'">수정</button><button type="button" class="btn btn-danger btn-sm p-1 pl-3 pr-3 font-weight-bold" value="'+ row.galleryId +'">삭제</button></td>';
                    },
                    "searchable": false
                },
            ],
            
        });

        $('#dataTable').on('click', '.btn-danger', function () {
            const id_num = $(this).val();
            if (confirm("해당 게시물을 삭제하시겠습니까?")) {
                $.ajax({
                    type: "DELETE",
                    url: "https://"+ base_url +"/api/v1/galleries/" + id_num,
                    beforeSend: function (xhr) {
                        if (localStorage.getItem('token')) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                        }
                    },
                    success: function (response) {
                        alert("삭제되었습니다.")
                        location.reload()
                    },
                    error: function (xhr, status, error) {
                        alert(error);
                    }
                });
            }
        });
        
        $('#dataTable').on('click', '.btn-primary', function () {
            const id_num = $(this).val();
            window.location.href = '/admin/GalleryUpload.html?id=' + id_num;
        });
    </script>
