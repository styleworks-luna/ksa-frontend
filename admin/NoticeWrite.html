    <script>
        let url = window.location.href;
        let base_url = url.replace(/^(https?:\/\/)?(www\.)?/i, "").split('/')[0];
        if (base_url === "ksa.onoffmix.xyz") {
            base_url = "api-" + base_url
        }
        // let base_url = "api-ksa.onoffmix.xyz";
        tinymce.init({
            selector: 'textarea',
            setup: function (editor) {
                editor.on('init', function () {});
            },
            images_upload_url: 'postAcceptor.php',
            automatic_uploads: false,
            plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount checklist mediaembed casechange export formatpainter pageembed linkchecker a11ychecker tinymcespellchecker permanentpen powerpaste advtable advcode editimage tinycomments tableofcontents footnotes mergetags autocorrect typography inlinecss',
            toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat',
            tinycomments_mode: 'embedded',
            tinycomments_author: 'Author name',
            mergetags_list: [
                { value: 'First.Name', title: 'First Name' },
                { value: 'Email', title: 'Email' },
            ]
        });
        
        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        const id_num = getParameterByName('id');
        if( id_num !== null ){
            $.ajax({
                "url": "https://"+ base_url +"/api/v1/notices/" + id_num,
                "method": 'GET',
                beforeSend: function (xhr) {
                    if (localStorage.getItem('token')) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                    }
                },
                success: function (response) {
                    tinymce.activeEditor.getContent(response.content);
                    $("input[ type='text']").val(response.title);
                    $("#myTextarea").val(response.content);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    alert('잘못된 요청입니다.');
                }
            });
            
            $("button[type='submit']").on("click", (event) => {
                let content = tinymce.activeEditor.getContent();
                let title = $("input[ type='text']").val();
                const data = {
                    "title": title,
                    "content": content
                }
                if (title === "" || content === "") {
                    alert("제목과 내용을 모두 입력해주세요.")
                } else {
                    $.ajax({
                        "url": "https://"+ base_url +"/api/v1/notices/" + id_num,
                        "method": 'PATCH',
                        beforeSend: function (xhr) {
                            if (localStorage.getItem('token')) {
                                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                            }
                        },
                        "data": JSON.stringify(data),
                        "contentType": 'application/json',
                        success: function (response) {
                            alert('수정 되었습니다.');
                            window.location.href = "NoticeList.html";
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            alert('수정에 실패했습니다.');
                        }
                    });
                }
            });

            $(".cancle-btn").on("click", (event) => {
                if (confirm("수정을 취소 하시겠습니까?")) {
                    window.history.back();
                }
            });
            
        }else{
            $("button[type='submit']").on("click", (event) => {
                let content = tinymce.activeEditor.getContent();
                let title = $("input[ type='text']").val();
                
                const data = {
                    "title": title,
                    "content": content
                }
                if (title === "" || content === "") {
                    alert("제목과 내용을 모두 입력해주세요.")
                } else {
                    $.ajax({
                        "url": "https://"+ base_url +"/api/v1/notices",
                        "method": 'POST',
                        beforeSend: function (xhr) {
                            if (localStorage.getItem('token')) {
                                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));
                            }
                        },
                        "data": JSON.stringify(data),
                        "contentType": 'application/json',
                        success: function (response) {
                            alert('등록되었습니다.');
                            window.location.href = "NoticeList.html";
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            alert('등록에 실패했습니다.');
                        }
                    });
                }
            });

            $(".cancle-btn").on("click", (event) => {
                let content = tinymce.activeEditor.getContent();
                let title = $("input[ type='text']").val();

                if (title === "" && content === ""){
                    window.history.back();
                }else{
                    if(confirm("등록을 취소 하시겠습니까?")){
                        window.history.back();
                    }
                }
            });
        }
    </script>
